[package]
name = "leakwatch"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Find secrets where they do not belong — by knowing their values, not by guessing their shape"
repository = "https://github.com/achimcc/leakwatch"
readme = "README.md"
keywords = ["secrets", "logs", "journald", "loki", "cli"]
categories = ["command-line-utilities"]

[dependencies]
aho-corasick = "1"
anyhow = "1"
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
toml = "0.9"
ureq = { version = "3", default-features = false }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
