[package]
name = "leakwatch"
version = "0.2.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Find secrets where they do not belong — by knowing their values, not by guessing their shape"
repository = "https://github.com/achimcc/leakwatch"
readme = "README.md"
keywords = ["secrets", "logs", "journald", "loki", "cli"]
categories = ["command-line-utilities"]

[dependencies]
aho-corasick = "1"
anyhow = "1"
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9.42"
toml = "0.9"
ureq = { version = "3", default-features = false }
zeroize = "1"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints.rust]
# No `unsafe` anywhere in this crate, and no `#[allow]` can bring it back.
unsafe_code = "forbid"

[profile.release]
lto = true
# A panic must not unwind through frames that hold secret values, and a
# process that holds every secret of the machine has no business continuing
# in an unknown state. (The core dump this could produce is switched off in
# the unit: LimitCORE=0, see README.)
panic = "abort"
